{% extends "base.html" %}

{% block title %}Settle · {{ group.name }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-body">
          <h1 class="h4 mb-3">Record settlement – {{ group.name }}</h1>
          <p class="text-muted mb-4">
            Record a manual payment between two group members. This will update the balances.
          </p>

          <form method="post" action="{% url 'splitwise:settle' group.id %}">
            {% csrf_token %}

            <div class="mb-3">
              <label for="from_user" class="form-label">From (who is paying)</label>
              <select name="from_user" id="from_user" class="form-select" required>
                <option value="">-- Select --</option>
                {% for member in members %}
                  <option value="{{ member.id }}">{{ member.username }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-3">
              <label for="to_user" class="form-label">To (who is receiving)</label>
              <select name="to_user" id="to_user" class="form-select" required>
                <option value="">-- Select --</option>
                {% for member in members %}
                  <option value="{{ member.id }}">{{ member.username }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-4">
              <label for="amount" class="form-label">Amount</label>
              <input
                type="number"
                name="amount"
                id="amount"
                step="0.01"
                min="0.01"
                class="form-control"
                required
              >
            </div>

            <div class="d-flex justify-content-between">
              <a href="{% url 'splitwise:group_detail' group.id %}" class="btn btn-outline-secondary">
                Cancel
              </a>
              <button type="submit" class="btn btn-success">
                Record settlement
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

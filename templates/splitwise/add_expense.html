{% extends "base.html" %}

{% block title %}Add expense · {{ group.name }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card">
        <div class="card-body">
          <h1 class="h4 mb-3">Add expense ({{ group.name }})</h1>

          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">Description</label>
              <input
                type="text"
                name="description"
                class="form-control"
                placeholder="e.g. Dinner, Uber, Groceries"
              >
            </div>

            <div class="mb-3">
              <label class="form-label">Amount</label>
              <input
                type="number"
                step="0.01"
                min="0.01"
                name="amount"
                class="form-control"
                placeholder="0.00"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label">Payer</label>
              <select name="paid_by" class="form-select" required>
                {% for m in members %}
                  <option value="{{ m.id }}">{{ m.username }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label">Participants</label>
              <div class="border rounded p-2 bg-light">
                {% for m in members %}
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      name="participants"
                      value="{{ m.id }}"
                      id="p-{{ m.id }}"
                      checked
                    >
                    <label class="form-check-label" for="p-{{ m.id }}">
                      {{ m.username }}
                    </label>
                  </div>
                {% endfor %}
              </div>
            </div>

            <div class="d-flex justify-content-between">
              <a href="{% url 'splitwise:group_detail' group.id %}" class="btn btn-outline-secondary">
                Cancel
              </a>
              <button type="submit" class="btn btn-primary">
                Save expense
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

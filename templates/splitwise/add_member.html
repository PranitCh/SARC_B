{% extends "base.html" %}

{% block title %}Add member · {{ group.name }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-body">
          <h1 class="h4 mb-3">Add member to {{ group.name }}</h1>
          <p class="text-muted mb-4">
            You can only add users you are friends with. Enter their username or email.
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Friend identifier</label>
              <input
                type="text"
                name="identifier"
                class="form-control"
                placeholder="username or email"
                required
              >
            </div>

            <div class="d-flex justify-content-between">
              <a href="{% url 'splitwise:group_detail' group.id %}" class="btn btn-outline-secondary">
                Back
              </a>
              <button type="submit" class="btn btn-primary">
                Add member
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
